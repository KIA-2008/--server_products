<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка - Управление товарами</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Магазин</a>
    <nav>
      <a href="index.html">← На витрину</a>
          <a href="auth.html">Аккаунт</a>
    </nav>
  </header>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="margin-bottom: 0;">Управление</h1>
      <button id="btn-add" class="btn btn-primary">+ Добавить товар</button>
    </div>
    
    <div id="message" class="message"></div>
    <div id="loader" class="hidden">Загрузка...</div>

    <table class="admin-table" id="products-table">
      <thead>
        <tr>
          <th>Фото</th>
          <th>Название</th>
          <th>Цена</th>
          <th>Описание</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <!-- Модальное окно -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Добавить товар</h2>
      <form id="product-form">
        <div class="form-group">
          <label>Название</label>
          <input type="text" name="title" required>
        </div>
        <div class="form-group">
          <label>Цена (₽)</label>
          <input type="number" name="price" min="0" required>
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea name="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Картинка</label>
          <input type="file" id="image" name="image" accept="image/*">
          <img id="image-preview" class="preview" style="display:none;" alt="Превью">
        </div>
        <div class="modal-actions" style="display:flex; justify-content:flex-end; gap: 1rem; margin-top: 2rem;">
          <button type="button" id="btn-cancel" class="btn">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ФУТЕР -->
  <footer class="footer">
    <div class="footer__content">
      <a href="index.html" class="footer__logo">Магазин</a>
      <div class="footer__links">
        <a href="#">О нас</a>
        <a href="#">Доставка</a>
        <a href="#">Контакты</a>
      </div>
    </div>
    <div class="footer__bottom">
      © 2026 Магазин. Все права защищены. Сделано с любовью к 3D и анимациям.
    </div>
  </footer>

  <!-- Скрипты -->
  <script type="module" src="js/effects.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
